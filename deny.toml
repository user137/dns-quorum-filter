[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
confidence-threshold = 0.93
# Unicode-3.0: OSI-approved, pulled in transitively by idna's ICU4X-based
# Unicode-normalization crates (icu_collections, icu_normalizer, ...) via
# hickory-proto -> idna (added Крок 0 batch 2).
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
