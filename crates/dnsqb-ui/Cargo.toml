[package]
name = "dnsqb-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "dnsqb-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dnsqb-service = { path = "../dnsqb-service", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"
tauri = { version = "2", features = [] }
