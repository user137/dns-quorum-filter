[package]
name = "dnsqb-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "dnsqb_service"
path = "src/lib.rs"

[[bin]]
name = "dnsqb-service"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
bytes = "1"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
hickory-proto = "0.26.1"
http = "1"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["http1", "http2", "server", "server-auto", "server-graceful", "tokio"] }
maxminddb = { version = "0.30.3", default-features = false }
moka = { version = "0.12", default-features = false, features = ["future"] }
parking_lot = "0.12"
percent-encoding = "2.3.2"
rcgen = { version = "0.14.9", default-features = false, features = ["aws_lc_rs", "pem", "zeroize"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"] }
toml = "1.1.4"
tracing = "0.1.41"
tracing-subscriber = "0.3"
zeroize = "1.9.0"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["test-util"] }
x509-parser = "0.18.1"
