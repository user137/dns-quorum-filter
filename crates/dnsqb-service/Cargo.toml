[package]
name = "dnsqb-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "dnsqb_service"
path = "src/lib.rs"

[[bin]]
name = "dnsqb-service"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
hickory-proto = "0.26.1"
moka = { version = "0.12", default-features = false, features = ["future"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1.41"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["test-util"] }
