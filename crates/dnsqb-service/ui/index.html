<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DNS Quorum Filter</title>
<link rel="stylesheet" href="/admin/ui/style.css" />
</head>
<body>
  <h1>DNS Quorum Filter</h1>
  <div id="status-pill" class="status-pill"><span class="dot"></span><span id="status-text">…</span></div>
  <div id="app-body">
    <p>Завантаження…</p>
  </div>
  <!-- T-47: kept outside #app-body, which the 2s status poll fully
       replaces - a free-text "add domain" input living inside that
       container would lose in-progress typing every refresh. This section
       has its own independent fetch/render cycle instead (see main.js). -->
  <div id="overrides-body" class="card">
    <h3>Списки виключень</h3>
    <p>Завантаження…</p>
  </div>
  <!-- T-153: same reasoning as #overrides-body above - number inputs the
       user is actively editing must not lose their in-progress value to the
       unrelated 2s status poll. -->
  <div id="cache-config-body" class="card">
    <h3>Кеш</h3>
    <p>Завантаження…</p>
  </div>
  <!-- T-46/T-54: same reasoning as #overrides-body/#cache-config-body above
       - a search box the user is actively typing into must not lose its
       value to the unrelated 2s status poll. Unlike those two, this section
       also doesn't auto-refresh on its own timer (see main.js) - a log
       table re-rendering under a reader every few seconds would be
       disruptive, not helpful. -->
  <div id="log-body" class="card">
    <h3>Лог запитів</h3>
    <p>Завантаження…</p>
  </div>
  <script src="/admin/ui/main.js"></script>
</body>
</html>
