[package]
name = "dnsqb-tray"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "dnsqb-tray"
path = "src/main.rs"

[dependencies]
dnsqb-service = { path = "../dnsqb-service", version = "0.2.0" }
parking_lot = "0.12"
rfd = { version = "0.15.4", default-features = false }
tao = "0.31.1"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "time"] }
tracing = "0.1.41"
tracing-subscriber = "0.3"
tray-icon = "0.21.3"

[dev-dependencies]
tempfile = "3"
