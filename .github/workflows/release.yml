name: Release

# T-102 (build + sign) + T-103 (tag -> draft GitHub release, gated on a
# cross-path reproducibility re-check). workflow_dispatch builds + signs and
# stops at the artifact; a `v*` tag also runs the `release` job.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-sign:
    runs-on: windows-latest
    outputs:
      mode: ${{ steps.sign.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      # Same reproducibility flags the `repro` job in ci.yml proved bit-identical
      # (single checkout here, so only the workspace root + CARGO_HOME to remap).
      - name: Reproducible-build RUSTFLAGS
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $flags = @(
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=src"
            "--remap-path-prefix=$cargoHome=cargo"
            "-Clink-arg=/Brepro"
          ) -join " "
          "RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      # If a real code-signing certificate is ever supplied as the CODESIGN_PFX
      # secret (base64 .pfx) + CODESIGN_PASSWORD, it is used and every signtool
      # step is strict. Otherwise an ephemeral self-signed cert is generated in
      # the runner (private key never leaves it, never committed, never a
      # secret) and the binaries are honestly labelled `test-signed` — production
      # trust comes from Microsoft Store re-signing the MSIX at publication.
      - name: Sign binaries
        id: sign
        shell: pwsh
        env:
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          # signtool's exit codes are inspected explicitly below; don't let a
          # non-zero native exit throw (PS 7.4 default) or leak as the step's
          # own exit code (this step ends with an explicit `exit`).
          $PSNativeCommandUseErrorActionPreference = $false
          $rel = "target/release"
          $names = 'dnsqb-service.exe', 'dnsqb-watcher.exe', 'dnsqb-tray.exe'
          $failed = $false

          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found on the runner" }
          Write-Host "signtool: $signtool"

          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          if ($env:CODESIGN_PFX) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX))
            $pw = $env:CODESIGN_PASSWORD
            $mode = "signed"
            $strict = $true
            Write-Host "Using supplied CODESIGN_PFX (production signing, strict)."
          } else {
            $pw = -join ((1..32) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
            Write-Host "::add-mask::$pw"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject "CN=dns-quorum-filter test signing (not for distribution)" `
              -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable `
              -KeyUsage DigitalSignature -HashAlgorithm SHA256
            Export-PfxCertificate -Cert $cert -FilePath $pfx `
              -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
            Remove-Item ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force
            $mode = "test-signed"
            $strict = $false
            Write-Host "No CODESIGN_PFX secret — ephemeral self-signed cert; binaries are $mode (NOT trusted)."
          }

          foreach ($n in $names) {
            & $signtool sign /fd SHA256 /f $pfx /p $pw /tr http://timestamp.digicert.com /td SHA256 (Join-Path $rel $n)
            if ($LASTEXITCODE -ne 0) {
              # A timestamp-server hiccup should not fail a test build; a real
              # cert must sign cleanly.
              Write-Host "::warning::signtool sign returned $LASTEXITCODE for $n"
              if ($strict) { $failed = $true }
            }
          }

          if ($strict) {
            & $signtool verify /pa /v (Join-Path $rel $names[0])
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::signtool verify failed (exit $LASTEXITCODE)"; $failed = $true }
          } else {
            # An ephemeral chain never verifies against a trusted root; report
            # the signature's presence without a process that always exits 1.
            foreach ($n in $names) {
              $sig = Get-AuthenticodeSignature (Join-Path $rel $n)
              Write-Host ("  {0}: {1}" -f $n, $sig.Status)
            }
          }

          Remove-Item $pfx -Force

          # SHA256SUMS computed AFTER signing — signing mutates the PE.
          $sums = foreach ($n in $names) {
            "{0}  {1}" -f (Get-FileHash (Join-Path $rel $n) -Algorithm SHA256).Hash.ToLower(), $n
          }
          $sums | Out-File (Join-Path $rel "SHA256SUMS") -Encoding ascii
          Get-Content (Join-Path $rel "SHA256SUMS")
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

          if ($failed) { exit 1 }
          exit 0

      - name: Upload signed binaries
        uses: actions/upload-artifact@v4
        with:
          # Artifact name carries the signing mode — a run is never silently
          # "just binaries" with the signing state left ambiguous.
          name: release-binaries-${{ steps.sign.outputs.mode }}
          if-no-files-found: error
          path: |
            target/release/dnsqb-service.exe
            target/release/dnsqb-watcher.exe
            target/release/dnsqb-tray.exe
            target/release/SHA256SUMS

  # T-103: only on a `v*` tag. Re-proves the cross-path bit-identical property
  # for this exact tag (ci.yml's `repro` runs on branch pushes, not here), then
  # publishes a DRAFT release — a maintainer reviews and clicks Publish. The
  # MSIX package is a named gap for Батч 3.8 (T-156), not built here.
  release:
    needs: build-sign
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-a
      - uses: actions/checkout@v4
        with:
          path: build-b
      - name: Compute path-independence RUSTFLAGS
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $flags = @(
            "--remap-path-prefix=$env:GITHUB_WORKSPACE\build-a=src"
            "--remap-path-prefix=$env:GITHUB_WORKSPACE\build-b=src"
            "--remap-path-prefix=$cargoHome=cargo"
            "-Clink-arg=/Brepro"
          ) -join " "
          "RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build in path A
        working-directory: build-a
        run: cargo build --release --workspace --locked
      - name: Build in path B
        working-directory: build-b
        run: cargo build --release --workspace --locked
      - name: Reproducibility gate
        shell: pwsh
        run: |
          $names = 'dnsqb-service.exe', 'dnsqb-watcher.exe', 'dnsqb-tray.exe'
          $mismatch = $false
          foreach ($n in $names) {
            $a = (Get-FileHash "build-a/target/release/$n" -Algorithm SHA256).Hash
            $b = (Get-FileHash "build-b/target/release/$n" -Algorithm SHA256).Hash
            if ($a -ne $b) { Write-Host "MISMATCH  $n`n  A: $a`n  B: $b"; $mismatch = $true }
            else { Write-Host "OK  $n  $a" }
          }
          if ($mismatch) { Write-Host "::error::unsigned build is not reproducible for this tag — not publishing"; exit 1 }
      - name: Download signed binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-binaries-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_MODE: ${{ needs.build-sign.outputs.mode }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $signLine = if ($env:SIGN_MODE -eq "signed") {
            "Binaries are signed with the configured production code-signing certificate."
          } else {
            "Binaries are **test-signed** with an ephemeral certificate and are NOT trusted by Windows. Production signing is applied by the Microsoft Store when the app is published there."
          }
          $notes = @"
          Automated **draft** release for ``$tag``. A maintainer reviews and publishes it.

          **Windows x64 binaries:** ``dnsqb-service.exe``, ``dnsqb-watcher.exe``, ``dnsqb-tray.exe``
          **Checksums:** ``SHA256SUMS`` — verify with ``Get-FileHash <file> -Algorithm SHA256``.

          **Signing:** $signLine

          **Reproducible build:** the unsigned binaries are byte-identical when rebuilt from this tag's source in a different directory; CI re-proves this before the draft is created.

          **Installer / MSIX packaging:** not in this release — Батч 3.8 (T-156).
          "@
          $notes | Out-File notes.md -Encoding utf8
          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $tag --draft --title $tag --notes-file notes.md @assets
          if ($LASTEXITCODE -ne 0) { exit 1 }
