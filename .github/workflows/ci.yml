name: CI

on:
  push:
    branches: ['**']  # not tags — a v* tag is a commit that already passed CI on main;
                       # release.yml owns the tag path and has its own repro gate.
    paths-ignore: ['**/*.md', 'diagrams/**', 'mockups/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'diagrams/**', 'mockups/**', 'LICENSE']

# A docs-only push cannot break a cargo gate, so it skips this workflow (a change
# touching ci.yml itself, or any non-doc file, still runs). Superseded runs on
# the same ref are cancelled — the latest commit is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# No explicit toolchain-install step: windows-latest ships rustup pre-installed,
# and every job's first `cargo`/`rustup` invocation reads rust-toolchain.toml and
# installs that exact pinned version + its declared components. Keeping the pin
# in one file (not duplicated as action inputs) avoids the two configs disagreeing.
#
# --locked on every cargo invocation (T-100): the build must fail rather than
# silently update Cargo.lock, so a CI build resolves the exact same dependency
# graph a third party gets from `git clone`. rust-toolchain.toml (pinned) and a
# tracked Cargo.lock are the other two legs; the `repro` job proves the result.
#
# Swatinem/rust-cache restores ~/.cargo + target/ so a small change is an
# incremental rebuild. The `repro` job is deliberately left uncached: it must
# clean-build twice to prove reproducibility, and a restored target/ could serve
# a stale artifact and hide non-determinism.

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --lib --bins --locked

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all -- --check

  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --doc --locked

  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check

  conformance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Blocking: catches compile breaks and an accidentally-removed #[ignore]
      # the same way any other test regression would (T-13).
      - run: cargo test --test conformance -p dnsqb-service --locked
      # Informational red board, not a merge gate: every RFC requirement not
      # yet implemented in Фаза 1 is `#[ignore]`d (DECISIONS.md, 2026-08-25) —
      # this step is expected to fail until Фаза 1 removes each #[ignore].
      - run: cargo test --test conformance -p dnsqb-service --locked -- --ignored
        continue-on-error: true

  coverage:
    runs-on: windows-latest
    continue-on-error: true # T-19: published as an artifact, non-blocking on MVP-stage
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lib --lcov --output-path lcov.info --locked
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  repro:
    runs-on: windows-latest
    # T-100: reproducibility must be proven across two DIFFERENT absolute build
    # paths, not a same-directory double build — a third party rebuilding from
    # source is the use case (SPEC.md "Наскрізні вимоги"), and only a path
    # difference exercises --remap-path-prefix. Two independent checkouts under
    # build-a/ and build-b/ give that. No rust-cache here (see file header).
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-a
      - uses: actions/checkout@v4
        with:
          path: build-b
      - name: Compute path-independence RUSTFLAGS
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          # RUSTFLAGS in the env replaces .cargo/config.toml rustflags, so /Brepro
          # is re-stated here alongside the remaps.
          $flags = @(
            "--remap-path-prefix=$env:GITHUB_WORKSPACE\build-a=src"
            "--remap-path-prefix=$env:GITHUB_WORKSPACE\build-b=src"
            "--remap-path-prefix=$cargoHome=cargo"
            "-Clink-arg=/Brepro"
          ) -join " "
          "RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build in path A
        working-directory: build-a
        run: cargo build --release --workspace --locked
      - name: Build in path B
        working-directory: build-b
        run: cargo build --release --workspace --locked
      - name: Compare release binary hashes
        shell: pwsh
        run: |
          $names = 'dnsqb-service.exe', 'dnsqb-watcher.exe', 'dnsqb-tray.exe'
          $mismatch = $false
          foreach ($n in $names) {
            $a = (Get-FileHash "build-a/target/release/$n" -Algorithm SHA256).Hash
            $b = (Get-FileHash "build-b/target/release/$n" -Algorithm SHA256).Hash
            if ($a -ne $b) {
              Write-Host "MISMATCH  $n"
              Write-Host "  A: $a"
              Write-Host "  B: $b"
              $mismatch = $true
            } else {
              Write-Host "OK  $n  $a"
            }
          }
          if ($mismatch) { exit 1 }
