name: Top-N curation

# T-107: regenerates the per-list availability-zone files under data/topn/
# (the Фаза 4 rating-filter "bubble" source). Manual — a human reviews the
# diff and commits it via a normal PR. The tool does NO DNS (it fetches a
# CrUX popularity list and normalises origin→registrable); content hygiene is
# a lazy runtime job in the client (T-108), not a curation-time scan.

on:
  workflow_dispatch:
    inputs:
      lists:
        description: 'Comma-separated: two-letter country codes and/or "global"'
        required: false
        default: 'ua,us,de,pl,gb,global'
      n:
        description: 'Rows to take from the CrUX top (1000) bucket'
        required: false
        default: '1000'
      month:
        description: 'CrUX month YYYYMM (country lists only; blank = newest published)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: topn-curate
  cancel-in-progress: false

jobs:
  curate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Curate lists
        shell: pwsh
        env:
          LISTS: ${{ inputs.lists }}
          TOPN: ${{ inputs.n }}
          MONTH: ${{ inputs.month }}
        run: |
          $toolArgs = @("lists=$env:LISTS", "n=$env:TOPN")
          if ($env:MONTH.Trim()) { $toolArgs += "month=$env:MONTH" }
          cargo run --release --example curate_topn --locked -- @toolArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: topn-lists
          if-no-files-found: error
          path: |
            data/topn/*.txt
            data/topn/*.txt.sha256
